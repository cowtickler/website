   <!-- ArcadeHub: game speed. The owner asked for the game to play twice as fast (2026-10-20).
        The game moves the balls one fixed step per game update, and Phaser normally runs one update per
        screen refresh, so the original went faster on 120/144 Hz screens. This runs the updates on a fixed
        clock instead: GAME_SPEED x 60 updates a second on every screen (2 = twice the original 60 Hz speed,
        1 = original speed). Menus, animations and the AI's thinking pauses keep real time; the in-game clock
        is kept in real seconds. -->
   <script>
      window.ARCADEHUB_GAME_SPEED = 2;
      (function () {
         var speed = window.ARCADEHUB_GAME_SPEED;
         var timer = setInterval(function () {
            var g = window.game;
            if (!g || !g.isBooted || !g.time) return;
            clearInterval(timer);
            // Phaser 2: allow several updates per refresh, each 1/60 s of game time, every 1/(60 x speed) s.
            g.forceSingleUpdate = false;
            g.time.slowMotion = 1 / speed;
            // Phaser skips a frame's updates when their count rises two frames in a row ("spiraling"),
            // which happens all the time on 120 Hz screens here; the count is already capped at 3 a frame.
            var update = g.update;
            g.update = function (time) { g._spiraling = 0; return update.call(g, time); };
            // The clock counts game updates (60 = 1 second), so count 1/speed per update.
            if (typeof window.updateTimer === "function") {
               window.updateTimer = function () {
                  var t = window.playState && window.playState.gameInfo;
                  if (!t || !t.timerStarted || window.projectInfo.tutorial != 0) return;
                  t.time += 1 / speed;
                  var e = Math.floor(t.time / 60), a = Math.floor(e / 60), i = Math.ceil(e % 60);
                  t.timerText.text = a + ":" + (i < 10 ? "0" + i : i);
               };
            }
         }, 50);
      })();
   </script>
