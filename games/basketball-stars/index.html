    <!-- ArcadeHub: lets the game draw at most 60 times a second, like on a normal 60 Hz screen (copied from

         144 Hz screens (40 game steps a second on all of them); the cap only stops it drawing 120 or 144 frames
         a second, which saves work on fast screens. It changes nothing on 60 Hz screens. -->
    <script>
    (function () {
        var raf = window.requestAnimationFrame.bind(window);
        var caf = window.cancelAnimationFrame.bind(window);
        var step = 1000 / 60, next = 0, frameTime = -1, ids = {}, count = 0;
        window.requestAnimationFrame = function (callback) {
            var id = ++count;
            function run(t) {
                // Every callback of an accepted screen refresh runs; other refreshes are skipped.
                if (t !== frameTime) {
                    if (t < next - 2) { ids[id] = raf(run); return; }
                    next = t - next < 100 ? next + step : t + step;
                    frameTime = t;
                }
                delete ids[id];
                callback(t);
            }
            ids[id] = raf(run);
            return id;
        };
        window.cancelAnimationFrame = function (id) {
            if (id in ids) { caf(ids[id]); delete ids[id]; }
        };
    })();
    </script>
