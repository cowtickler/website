<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<!-- <meta http-equiv="Content-Type" content="text/html; charset=utf-8"> -->

	<meta name="robots" content="noindex,nofollow" />
	<!-- ArcadeHub: the Content-Security-Policy below stops the game from contacting other websites. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
	<!-- ArcadeHub: the original page lost the <script> tag that opened this block, so it showed as text. -->
	<script>
		var Module = {
		};
	</script>
	<!-- ArcadeHub: local stand-in for the game's ad SDKs (no ads, nothing fetched). -->
	<script src="arcadehub-no-ads.js"></script>
	<script src="UnityLoader.js"></script>
	<script src="jquery-3.5.0.min.js"></script>
	<script src="progress.js"></script>

	<link rel="stylesheet" href="animate.css">

	<script>
		var gameInstance = UnityLoader.instantiate("gameContainer", "StackBall2_GDistribution.json", {onProgress: UnityProgress});
		var scaleToFit;
		try{
			scaleToFit = !!JSON.parse("");
		}catch(e){
			scaleToFit = true;
		}
		window.onresize = function(){
			var canvas = gameInstance.Module.canvas;
			var container = gameInstance.container;
			var w;
			var h;

			if(scaleToFit){
				w = window.innerWidth;
				h = window.innerHeight;

				var r = 768/432;

				if(w * r > window.innerHeight){
					w = Math.min(w, Math.ceil(h / r));
				}
				h = Math.floor(w * r);
			}else{
				w=432;
				h=768;
			}

			container.style.width = canvas.style.width = w + "px";
			container.style.height = canvas.style.height = h + "px";
			container.style.top = Math.floor((window.innerHeight - h)/2) + "px";
			container.style.left = Math.floor((window.innerWidth - w)/2) + "px";
		}
	</script>
	<style>
		html,body{
			background: #000;
			width: 100%;
			height: 100%;
			overflow:visible;
			padding:0;
			margin:0;
		}
		div#gameContainer{
			background: transparent!important;
			position: absolute;
		}
		div#gameContainer canvas{
			position: absolute;
			image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
            /* image-rendering: optimize-contrast; */
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
	<style>

			/* margin-left: -100px; */
			/* left: 50%; */

			/* bottom: 10px; */

		div#progressBar {
			/* left: 50%; */
			/* position: absolute; */
			/* margin-left: -100px; */

			/* bottom: 10px; */

		#siteInfo {
			position: absolute;

			bottom: 0;
			height: 5.2%;

			width: 20%;

			/* background: #0006; */

		}

		#siteInfo.show {

			/* left: 0px; */
		}

		#siteInfo .siteInfoContainer {

		}

		#siteInfo .siteInfoContainer img {

		#gameContainer { 
			display: none;
		}

		#gameContainer.show {
