<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.emulatorjs.org; style-src 'self' 'unsafe-inline' https://cdn.emulatorjs.org; img-src 'self' data: blob: https://cdn.emulatorjs.org https://allancoding-files.netlify.app; connect-src 'self' data: blob: https://cdn.emulatorjs.org https://allancoding-files.netlify.app; media-src 'self' data: blob:; font-src 'self' data: https://cdn.emulatorjs.org; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Super Mario World</title>
  <style>
    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    noscript {
      display: grid;
      min-height: 100%;
      place-items: center;
      color: #fff;
      font: 1rem/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <noscript>This game requires JavaScript.</noscript>

  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'snes';
    window.EJS_gameName = 'Super Mario World';
    window.EJS_color = '#0097c4';
    window.EJS_backgroundColor = '#000';
    window.EJS_backgroundImage = 'https://allancoding-files.netlify.app/snes-nes/SMW.jpg';
    window.EJS_gameUrl = 'https://allancoding-files.netlify.app/snes-nes/SMW.smc.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/4.2.3/data/loader.js"></script>
</body>
</html>
