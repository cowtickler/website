<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- frame-src lists the other websites whose games the player may frame (keep it in step with externalOrigins in js/config.js).
       storage.y8.com is Y8's game file server, in case Y8's embed page moves the frame there. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://games.engineering.com https://www.y8.com https://storage.y8.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Play · ArcadeHub</title>
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/games.js" defer></script>
  <script src="js/player.js" defer></script>
</head>
<body class="page-play">
  <nav class="play-bar" aria-label="Game">
    <a class="icon-btn" id="back-btn" href="index.html" aria-label="Back to games" title="Back to games">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <!-- Games framed from another website also show their title, source and a reload button. -->
    <p class="play-info" id="play-info" hidden>
      <span class="play-title" id="play-title"></span>
      <span class="play-credit">from <a id="play-source" href="index.html" target="_blank" rel="noopener noreferrer"></a></span>
    </p>
    <span class="play-actions">
      <button class="icon-btn" type="button" id="reload-btn" aria-label="Reload game" title="Reload game" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.5M20 3.5v5h-5"/></svg>
      </button>
      <button class="icon-btn" type="button" id="fullscreen-btn" aria-label="Fullscreen" title="Fullscreen" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </span>
  </nav>

  <main class="player-stage" id="player-stage" tabindex="-1">
    <h1 class="visually-hidden" id="game-title">Game</h1>
    <div class="player-frame-wrap" id="frame-wrap"></div>

    <div class="player-overlay" id="player-loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span class="visually-hidden">Loading game</span>
    </div>

    <section class="player-overlay player-external" id="player-external" aria-labelledby="external-title" hidden>
      <div class="external-box">
        <img class="external-thumb" id="external-thumb" alt="" width="320" height="180" hidden>
        <h2 class="external-title" id="external-title"></h2>
        <p class="external-credit" id="external-credit" hidden></p>
        <p class="external-text" id="external-text"></p>
        <div class="overlay-actions">
          <a class="text-btn text-btn-primary" id="external-link" href="index.html" target="_blank" rel="noopener noreferrer">Open Official Game</a>
          <a class="text-btn" href="index.html">Back to games</a>
        </div>
        <p class="external-note" id="external-network"></p>
        <p class="external-url" id="external-url"></p>
      </div>
    </section>

    <div class="player-overlay" id="player-error" role="alert" hidden>
      <p id="player-error-text">This game could not be loaded.</p>
      <div class="overlay-actions">
        <button class="text-btn" type="button" id="error-retry">Try again</button>
        <a class="text-btn" id="error-original" href="index.html" target="_blank" rel="noopener noreferrer" hidden>Open Original Game</a>
        <a class="text-btn" href="index.html">Back to games</a>
      </div>
      <p class="external-note" id="error-note" hidden></p>
    </div>

    <button class="icon-btn fs-exit" type="button" id="fs-exit" aria-label="Exit fullscreen" title="Exit fullscreen">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </main>
</body>
</html>
